<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memes</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="sidebar-zone">
        <div class="sidebar-trigger"></div>
        <div class="sidebar" data-sidebar>
            <span class="btn-icon" data-upload>&#8593;</span>
            <input type="file" accept="image/*" hidden data-file-input>
            <span class="btn-icon" data-token-info>&#9881;</span>
            <div class="token-form hidden" data-token-form>
                <input type="password" placeholder="Token" data-token-input>
                <button data-save-token>OK</button>
            </div>
        </div>
    </div>

    <div class="gallery" data-gallery></div>

    <div class="lightbox" data-lightbox>
        <button class="lightbox-btn lightbox-close" data-close>&times;</button>
        <button class="lightbox-btn lightbox-prev" data-prev>&lsaquo;</button>
        <img src="" alt="">
        <button class="lightbox-btn lightbox-next" data-next>&rsaquo;</button>
    </div>

    <script type="module" src="assets/gallery.js"></script>
    <script type="module" src="assets/upload.js"></script>
</body>
</html>
