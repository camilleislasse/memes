name: Auto Merge

on:
  pull_request:
    types: [opened]
  push:
    branches: [main]
    paths:
      - 'memes/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'camilleislasse'
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            });

  update-gallery:
    needs: [merge]
    if: always() && (github.event_name != 'pull_request' || needs.merge.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update images.json and README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            echo "[" > images.json
            first=true
            for img in memes/*.{png,jpg,jpeg,gif,webp}; do
              if [ -f "$img" ]; then
                [ "$first" = true ] && first=false || echo "," >> images.json
                echo "  \"$img\"" >> images.json
              fi
            done
            echo "]" >> images.json

            python3 .github/generate_readme.py

            git add images.json README.md
            git diff --staged --quiet && break
            git commit -m "chore: update gallery"
            git push && break || git reset --soft HEAD~1
          done